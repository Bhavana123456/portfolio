name: Sync portfolio data

on:
  schedule:
    - cron: "0 */6 * * *"        # every six hours
  workflow_dispatch:              # manual run from the Actions tab
  repository_dispatch:            # other repos can trigger: event type "repo-updated"
    types: [repo-updated]
  push:
    branches: [main]
    paths: ["scripts/**", "src/config.ts", ".github/workflows/sync.yml"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate data
        run: npm run sync
        env:
          # GH_STATS_TOKEN: personal token (read:user) for the contribution calendar; falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed (Vercel redeploys on push)
        run: |
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "chore: sync portfolio data" && git push)
